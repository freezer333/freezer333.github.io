<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f3b6e"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f7f17"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1600" height="790" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#0f3b6e">Vector Search as a Tool in the Agent Loop</text>

  <!-- Messages array -->
  <rect x="40" y="100" width="500" height="480" rx="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <text x="290" y="144" text-anchor="middle" font-size="27" font-weight="700" fill="#1e3a8a">Messages array</text>

  <g font-size="21" fill="#0f2a4a">
    <rect x="70" y="170" width="440" height="78" rx="10" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/>
    <text x="90" y="202" font-weight="700">system</text>
    <text x="90" y="232">prompt + tool schemas, incl. search_docs</text>

    <rect x="70" y="262" width="440" height="78" rx="10" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/>
    <text x="90" y="294" font-weight="700">user</text>
    <text x="90" y="324">"How do I reset a customer's password?"</text>

    <rect x="70" y="354" width="440" height="78" rx="10" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/>
    <text x="90" y="386" font-weight="700">assistant — tool_use</text>
    <text x="90" y="416" font-family="DejaVu Sans Mono, monospace" font-size="19">search_docs("reset password")</text>

    <rect x="70" y="446" width="440" height="100" rx="10" fill="#fde9cc" stroke="#d97706" stroke-width="3"/>
    <text x="90" y="478" font-weight="700">user — tool_result</text>
    <text x="90" y="507">Top 3 chunks, as plain text:</text>
    <text x="90" y="533" font-style="italic" font-size="19">"To reset a password, open Admin &gt; Users…"</text>
  </g>

  <!-- LLM -->
  <rect x="630" y="190" width="230" height="110" rx="16" fill="#1f7f95" stroke="#0f3b6e" stroke-width="3"/>
  <text x="745" y="238" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">LLM</text>
  <text x="745" y="274" text-anchor="middle" font-size="18" fill="#ffffff">reads text, writes text</text>

  <!-- 1 send -->
  <line x1="542" y1="245" x2="624" y2="245" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/>
  <text x="584" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#0f3b6e">1 send</text>

  <!-- 2 tool_use -->
  <line x1="862" y1="245" x2="1034" y2="245" stroke="#3f7f17" stroke-width="4" marker-end="url(#ahg)"/>
  <text x="948" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#3f7f17">2 tool_use</text>
  <text x="948" y="272" text-anchor="middle" font-size="18" fill="#3f7f17">query string</text>

  <!-- Tool execution -->
  <rect x="1040" y="100" width="520" height="480" rx="18" fill="#f3f9ee" stroke="#3f7f17" stroke-width="4"/>
  <text x="1300" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#2f6410">Tool execution — your code</text>

  <rect x="1090" y="172" width="420" height="82" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="2.5"/>
  <text x="1300" y="206" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Embedding model</text>
  <text x="1300" y="236" text-anchor="middle" font-size="19" fill="#ffffff">query text → query vector</text>
  <line x1="1300" y1="256" x2="1300" y2="300" stroke="#2f6410" stroke-width="4" marker-end="url(#ahg)"/>

  <rect x="1090" y="304" width="420" height="82" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="2.5"/>
  <text x="1300" y="338" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Vector database</text>
  <text x="1300" y="368" text-anchor="middle" font-size="19" fill="#ffffff">find the closest stored vectors</text>
  <line x1="1300" y1="388" x2="1300" y2="432" stroke="#2f6410" stroke-width="4" marker-end="url(#ahg)"/>

  <rect x="1090" y="436" width="420" height="82" rx="12" fill="#e2f0d6" stroke="#2f6410" stroke-width="2.5"/>
  <text x="1300" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6410">Chunk text</text>
  <text x="1300" y="500" text-anchor="middle" font-size="19" fill="#2f6410">the original text of the top 3</text>

  <!-- 3 tool_result return -->
  <path d="M1300,582 L1300,636 L290,636 L290,588" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#aho)"/>
  <text x="788" y="626" text-anchor="middle" font-size="20" font-weight="700" fill="#d97706">3 append as tool_result (role: user) — then send again</text>

  <!-- 4 end_turn -->
  <line x1="735" y1="302" x2="735" y2="404" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/>
  <text x="749" y="360" font-size="20" font-weight="700" fill="#0f3b6e">4 end_turn</text>
  <rect x="605" y="408" width="260" height="70" rx="12" fill="#cfe3ef" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="735" y="451" text-anchor="middle" font-size="22" font-weight="700" fill="#0f3b6e">Answer to user</text>

  <!-- callout -->
  <rect x="220" y="668" width="1160" height="96" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="800" y="710" text-anchor="middle" font-size="27" font-weight="700" fill="#0f3b6e">The LLM sends a query string and gets back text.</text>
  <text x="800" y="746" text-anchor="middle" font-size="27" font-weight="700" fill="#0f3b6e">It never sees a vector.</text>
</svg>
