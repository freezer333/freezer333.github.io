</defs><rect width="1600" height="790" fill="#ffffff"/><defs><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect x="30" y="30" width="1540" height="250" rx="18" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="70" text-anchor="start" font-size="24" font-weight="700" fill="#0f3b6e">Setup — once, and again when the documents change</text><rect x="30" y="390" width="1540" height="370" rx="18" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="430" text-anchor="start" font-size="24" font-weight="700" fill="#0f3b6e">Query — every request</text><rect x="90" y="110" width="330" height="120" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="255" y="158" text-anchor="middle" font-size="25" font-weight="700" fill="#0f3b6e">Help center articles</text><text x="255" y="192" text-anchor="middle" font-size="19" font-weight="400" fill="#334155">500 documents</text><rect x="560" y="110" width="360" height="120" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="3"/><text x="740" y="158" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Chunk + embed</text><text x="740" y="192" text-anchor="middle" font-size="19" font-weight="400" fill="#fff">embedding model → vectors</text><path d="M1080.0,122 L1080.0,240 A150.0,22 0 0 0 1380.0,240 L1380.0,122" fill="#1f7f95" stroke="#0f3b6e" stroke-width="3"/><ellipse cx="1230" cy="122" rx="150.0" ry="22" fill="#2a95ad" stroke="#0f3b6e" stroke-width="3"/><text x="1230" y="192" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Vector database</text><text x="1230" y="224" text-anchor="middle" font-size="19" font-weight="400" fill="#fff">chunk text + vectors</text><line x1="422" y1="170" x2="554" y2="170" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><line x1="922" y1="170" x2="1074" y2="170" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="50" y="480" width="250" height="230" rx="12" fill="#ffffff" stroke="#2c5aa0" stroke-width="3"/><text x="175" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#0f3b6e">User query</text><text x="175" y="572" text-anchor="middle" font-size="21" font-weight="500" fill="#0f3b6e" font-style="italic">"How do I reset a</text><text x="175" y="599" text-anchor="middle" font-size="21" font-weight="500" fill="#0f3b6e" font-style="italic">customer's</text><text x="175" y="626" text-anchor="middle" font-size="21" font-weight="500" fill="#0f3b6e" font-style="italic">password?"</text><rect x="360" y="480" width="215" height="230" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="3"/><text x="467" y="516" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Retrieve</text><rect x="375" y="534" width="185" height="58" rx="8" fill="#e2f0d6" stroke="#2f6410" stroke-width="2"/><text x="467" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6410">same embedding</text><text x="467" y="578" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6410">model</text><line x1="467" y1="594" x2="467" y2="616" stroke="#ffffff" stroke-width="3" marker-end="url(#ahw)"/><rect x="375" y="620" width="185" height="40" rx="8" fill="#0f3b6e" stroke="#0f3b6e" stroke-width="2"/><text x="467" y="646" text-anchor="middle" font-size="16" font-weight="500" fill="#fff" font-family="DejaVu Sans Mono, monospace">[0.03, -0.21, …]</text><text x="467" y="686" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">query vector</text><rect x="635" y="480" width="360" height="230" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="815.0" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#0f3b6e">Augment context</text><rect x="655" y="542" width="320" height="40" rx="6" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/><text x="815.0" y="569" text-anchor="middle" font-size="17" font-weight="400" fill="#0f3b6e">system prompt + user query</text><rect x="655" y="590" width="320" height="52" rx="6" fill="#fde9cc" stroke="#d97706" stroke-width="2"/><text x="815.0" y="612" text-anchor="middle" font-size="16" font-weight="500" fill="#92400e">"To reset a password, open</text><text x="815.0" y="633" text-anchor="middle" font-size="16" font-weight="500" fill="#92400e">Admin &gt; Users and select…"</text><rect x="655" y="650" width="320" height="52" rx="6" fill="#fde9cc" stroke="#d97706" stroke-width="2"/><text x="815.0" y="672" text-anchor="middle" font-size="16" font-weight="500" fill="#92400e">"Reset links expire after</text><text x="815.0" y="693" text-anchor="middle" font-size="16" font-weight="500" fill="#92400e">24 hours…"</text><rect x="1055" y="480" width="150" height="230" rx="12" fill="#1f7f95" stroke="#0f3b6e" stroke-width="3"/><text x="1130" y="605.0" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">LLM</text><rect x="1265" y="480" width="285" height="230" rx="12" fill="#ffffff" stroke="#2c5aa0" stroke-width="3"/><text x="1407" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#0f3b6e">Response</text><text x="1407" y="568" text-anchor="middle" font-size="18" font-weight="500" fill="#0f3b6e" font-style="italic">"Open Admin &gt; Users,</text><text x="1407" y="593" text-anchor="middle" font-size="18" font-weight="500" fill="#0f3b6e" font-style="italic">select the account, and</text><text x="1407" y="618" text-anchor="middle" font-size="18" font-weight="500" fill="#0f3b6e" font-style="italic">click Reset password.</text><text x="1407" y="643" text-anchor="middle" font-size="18" font-weight="500" fill="#0f3b6e" font-style="italic">The link expires in</text><text x="1407" y="668" text-anchor="middle" font-size="18" font-weight="500" fill="#0f3b6e" font-style="italic">24 hours."</text><line x1="302" y1="595.0" x2="354" y2="595.0" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><line x1="577" y1="595.0" x2="629" y2="595.0" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><line x1="997" y1="595.0" x2="1049" y2="595.0" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><line x1="1207" y1="595.0" x2="1259" y2="595.0" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><path d="M420,478 L420,318 L1180,318 L1180,268" fill="none" stroke="#3f7f17" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#ahg)"/><text x="800" y="308" text-anchor="middle" font-size="19" font-weight="700" fill="#3f7f17">search with the query vector</text><path d="M1280,264 L1280,352 L515,352 L515,474" fill="none" stroke="#d97706" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#aho)"/><text x="900" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#d97706">2 closest chunks, as text</text></svg>