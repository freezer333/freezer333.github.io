</defs><rect width="1600" height="720" fill="#ffffff"/><rect x="30" y="30" width="750" height="660" rx="18" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/><text x="405" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#0f3b6e">Retrieve first</text><text x="405" y="114" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">your code decides</text><rect x="820" y="30" width="750" height="660" rx="18" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/><text x="1195" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#0f3b6e">Retrieval as a tool</text><text x="1195" y="114" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">the model decides</text><rect x="255" y="150" width="300" height="70" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="405" y="193" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3b6e">User query</text><line x1="405" y1="222" x2="405" y2="262" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="235" y="266" width="340" height="90" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="3"/><text x="405" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Retrieve</text><text x="405" y="336" text-anchor="middle" font-size="18" font-weight="400" fill="#fff">search with the user's question</text><line x1="405" y1="358" x2="405" y2="398" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="235" y="402" width="340" height="90" rx="12" fill="#1f7f95" stroke="#0f3b6e" stroke-width="3"/><text x="405" y="442" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">LLM</text><text x="405" y="472" text-anchor="middle" font-size="18" font-weight="400" fill="#fff">query + retrieved text</text><line x1="405" y1="494" x2="405" y2="534" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="255" y="538" width="300" height="70" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="405" y="581" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3b6e">Answer</text><text x="405" y="648" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Search runs on every query. One LLM call.</text><rect x="860" y="150" width="300" height="70" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="1010" y="193" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3b6e">User query</text><line x1="1010" y1="222" x2="1010" y2="296" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="880" y="300" width="260" height="110" rx="12" fill="#1f7f95" stroke="#0f3b6e" stroke-width="3"/><text x="1010" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">LLM</text><text x="1010" y="382" text-anchor="middle" font-size="17" font-weight="400" fill="#fff">decides whether to search</text><rect x="1325" y="300" width="225" height="110" rx="12" fill="#4d9a1f" stroke="#2f6410" stroke-width="3"/><text x="1437" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Search tool</text><text x="1437" y="378" text-anchor="middle" font-size="18" font-weight="400" fill="#fff">your code runs it</text><line x1="1142" y1="330" x2="1319" y2="330" stroke="#3f7f17" stroke-width="4" marker-end="url(#ahg)"/><text x="1231" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#3f7f17" font-family="DejaVu Sans Mono, monospace">tool_use</text><line x1="1323" y1="382" x2="1146" y2="382" stroke="#3f7f17" stroke-width="4" marker-end="url(#ahg)"/><text x="1233" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#3f7f17" font-family="DejaVu Sans Mono, monospace">tool_result</text><text x="1437" y="446" text-anchor="middle" font-size="18" font-weight="600" fill="#3f7f17" font-style="italic">may repeat, or never run</text><line x1="1010" y1="412" x2="1010" y2="534" stroke="#0f3b6e" stroke-width="4" marker-end="url(#ah)"/><rect x="860" y="538" width="300" height="70" rx="12" fill="#dbe7f3" stroke="#2c5aa0" stroke-width="2.5"/><text x="1010" y="581" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3b6e">Answer</text><text x="1195" y="648" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">The model writes the query. Each search adds an LLM call.</text></svg>